<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <!-- Frosted-AIO icon: an icy pump ring around a snowflake, on a dark disc. Source for every icon size
       (npm run icon renders it to build/icon.ico and src/assets/*.png). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#16293a"/>
      <stop offset="1" stop-color="#0a131c"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="224" y2="224">
      <stop offset="0" stop-color="#e9f8ff"/>
      <stop offset="1" stop-color="#5fb4e6"/>
    </linearGradient>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="216" y2="216">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#7cc8f2"/>
    </linearGradient>
    <g id="arm">
      <line x1="128" y1="128" x2="128" y2="40"/>
      <polyline points="104,66 128,88 152,66" fill="none"/>
      <polyline points="112,46 128,60 144,46" fill="none"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 14"/>
  <g transform="translate(128 128) scale(0.62) translate(-128 -128)" stroke="url(#ice)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#arm"/>
    <use xlink:href="#arm" transform="rotate(60 128 128)"/>
    <use xlink:href="#arm" transform="rotate(120 128 128)"/>
    <use xlink:href="#arm" transform="rotate(180 128 128)"/>
    <use xlink:href="#arm" transform="rotate(240 128 128)"/>
    <use xlink:href="#arm" transform="rotate(300 128 128)"/>
  </g>
</svg>
